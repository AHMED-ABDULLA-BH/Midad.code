[package]
name = "midad"
version = "0.5.0"
edition = "2024"

[dependencies]
rustybuzz = "0.20"
serde = { version = "1", features = ["derive","rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-bidi = "0.3"
unicode-joining-type = "1"
tempfile = "3"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
svg2pdf = { version = "0.13", default-features = false, features = ["image"] }
pdf-writer = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL", "NSThread", "NSNotification", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std","NSApplication","NSResponder","NSWindow","NSView","NSControl","NSButton","NSButtonCell","NSCell","NSText","NSTextField","NSFont","NSColor","NSBezierPath","NSGraphics","NSEvent","NSMenu","NSMenuItem","NSPopUpButton","NSOpenPanel","NSSavePanel","NSPanel","NSRunningApplication","NSPrintInfo","NSPrintOperation","NSGraphicsContext","NSAlert","NSImage","NSImageView","NSImageCell","NSUserInterfaceLayout","NSParagraphStyle","objc2-core-foundation"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }
